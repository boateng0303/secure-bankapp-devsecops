apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoremediation-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autoremediation-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autoremediation-binding
subjects:
- kind: ServiceAccount
  name: autoremediation-sa
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: autoremediation-role
  apiGroup: rbac.authorization.k8s.io