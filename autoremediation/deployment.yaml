apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoremediation
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoremediation
  template:
    metadata:
      labels:
        app: autoremediation
    spec:
      serviceAccountName: autoremediation-sa
      containers:
      - name: autoremediation
        image: <your-registry>/autoremediation:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: autoremediation
  namespace: monitoring
spec:
  selector:
    app: autoremediation
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000