apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-config
  namespace: banking
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  
  CORS_ALLOWED_ORIGINS: "https://kwasiboateng.lol"
  
  JWT_EXPIRATION: "86400000"
  
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_BANKING: "DEBUG"
  
  DB_HOST: "kwasi-prod.mysql.database.azure.com"
  DB_PORT: "3306"
  DB_NAME: "banking_db"
  DB_POOL_SIZE: "10"
  DB_CONNECTION_TIMEOUT: "30000"
