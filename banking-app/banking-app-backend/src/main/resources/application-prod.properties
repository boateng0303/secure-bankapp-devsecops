# Production Configuratio

# MySQL Database Configuration (values from ConfigMap + Key Vault)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console Disabled
spring.h2.console.enabled=false

# JWT Configuration (from Key Vault + ConfigMap)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (from ConfigMap)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://kwasiboateng.lol}

# Logging (from ConfigMap)
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.banking=${LOGGING_LEVEL_COM_BANKING:INFO}
logging.level.org.springframework.security=WARN
